<div class="reserve-wrapper">
  <div class="reserve-card">
    <h2>Hotel Reservation</h2>

    <form [formGroup]="reserveForm" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" />
        <small *ngIf="reserveForm.get('fullName')?.invalid && reserveForm.get('fullName')?.touched">
          Full name is required
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
        <small *ngIf="reserveForm.get('email')?.invalid && reserveForm.get('email')?.touched">
          Enter a valid email
        </small>
      </div>

      <div class="form-group">
        <label>City</label>
        <select formControlName="city">
          <option value="">Select city</option>
          <option value="rome">Rome</option>
          <option value="paris">Paris</option>
          <option value="newyork">New York</option>
        </select>
      </div>

      <div class="form-group">
        <label>Check-in</label>
        <input type="date" formControlName="checkIn" />
      </div>

      <div class="form-group">
        <label>Check-out</label>
        <input type="date" formControlName="checkOut" />
      </div>

      <button type="submit" [disabled]="reserveForm.invalid">
        Reserve Now
      </button>

    </form>
  </div>
</div>
